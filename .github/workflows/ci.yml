name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单测均为 mock，无基础设施依赖；*ApplicationTests / AllModelsTest 需真实
      # MySQL/Redis/Qdrant/API Key（Spring 上下文启动），CI 不提供，予以排除。
      - name: Run unit tests
        run: mvn -B test -Dtest='!*ApplicationTests,!AllModelsTest' -Dsurefire.failIfNoSpecifiedTests=false

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
