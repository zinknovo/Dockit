server:
  port: 8083

spring:
  application:
    name: ai-service
  main:
    allow-bean-definition-overriding: true

  autoconfigure:
    exclude:
      - com.alibaba.cloud.nacos.discovery.NacosDiscoveryAutoConfiguration
      - com.alibaba.cloud.nacos.registry.NacosServiceRegistryAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

  datasource:
    url: jdbc:mysql://${MYSQL_LOCAL_HOST:localhost}:${MYSQL_LOCAL_PORT:3306}/${MYSQL_DATABASE:dockit}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 10000

  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        enabled: false
      registry:
        enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  ai:
    models:
      default: deepseek-v4-flash-vision-exp
      # 模型注册表：code -> (provider, name, 端点, 实际模型名)。加模型只加配置，无需改代码。
      # chat 三条目当前全部指向智谱 GLM OpenAI 兼容端点（与 application.yml 保持一致）
      list:
        deepseek-v4-pro:
          provider: openai-compatible
          name: GLM 5.3
          api-key: ${OPENAI_API_KEY}
          base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3
          enabled: true
        deepseek-v4-flash-vision-exp:
          provider: openai-compatible
          name: GLM 5.3 FlashX（默认）
          api-key: ${OPENAI_API_KEY}
          base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3-flashx
          enabled: true
        ark-code-latest:
          provider: openai-compatible
          name: GLM 5.3 Flash
          api-key: ${ARK_API_KEY}
          base-url: ${ARK_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3-flash
          enabled: true
    # 向量化 embedding（OpenAI 兼容端点，当前为智谱 embedding-3，2048 维；
    # 换 embedding 模型必须删 Qdrant collection dockit-docs 重建，旧维度向量不能混用）
    embedding:
      api-key: ${ARK_API_KEY}
      base-url: ${ARK_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: embedding-3
      tokens-per-second: ${ARK_EMBEDDING_TPS:1000}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      rerank:
        enabled: true
        model: qwen3-rerank
        timeout-ms: 10000
        api-key: ${DASHSCOPE_API_KEY}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# AI配置
ai:
  conversation:
    max-messages: 100
    expiry-hours: 24
  agent:
    reflection:
      enabled: true
  vector:
    qdrant-url: ${QDRANT_URL:http://localhost:6333}
  aiops:
    metrics:
      retention-ms: 900000
      persist-interval-ms: 60000
    detection:
      interval-ms: 60000
      window-ms: 300000
      latency-p95-threshold-ms: 5000
      error-rate-threshold: 0.1
      min-request-count: 10
    alert:
      cooldown-ms: 300000
# MinIO配置
minio:
  endpoint: ${MINIO_LOCAL_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: doc-ai
  bucket-permissions: "documents=admin,user;doc-ai=admin,user"
  bucket-permission-default-allow: false
  url:
    expiry: 3600
  recycle:
    expiry-days: 7
  delete:
    confirmation-timeout: 300

# 文档服务配置
document:
  service:
    url: http://localhost:8084

# 日志配置
logging:
  level:
    com.javaee.aiservice: debug
    org.springframework.ai: info
    org.springframework.security: info

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
