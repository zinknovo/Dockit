server:
  port: 8083

spring:
  application:
    name: ai-service
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
  
  cloud:
    compatibility-verifier:
      enabled: false
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:nacos}:${NACOS_PORT:8848}
        namespace: public

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  ai:
    models:
      default: deepseek-v4-flash-vision-exp
      # 模型注册表：code -> (provider, name, 端点, 实际模型名)。加模型只加配置，无需改代码。
      # chat 三条目当前全部指向智谱 GLM OpenAI 兼容端点（OPENAI_API_KEY 与 ARK_API_KEY 同值）
      list:
        deepseek-v4-pro:
          provider: openai-compatible
          name: GLM 5.3
          api-key: ${OPENAI_API_KEY}
          base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3
          enabled: true
        deepseek-v4-flash-vision-exp:
          provider: openai-compatible
          name: GLM 5.3 FlashX（默认）
          api-key: ${OPENAI_API_KEY}
          base-url: ${OPENAI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3-flashx
          enabled: true
        ark-code-latest:
          provider: openai-compatible
          name: GLM 5.3 Flash
          api-key: ${ARK_API_KEY}
          base-url: ${ARK_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
          api-model-name: glm-5.3-flash
          enabled: true
    # 向量化 embedding（OpenAI 兼容端点，当前为智谱 embedding-3，2048 维；
    # 换 embedding 模型必须删 Qdrant collection dockit-docs 重建，旧维度向量不能混用）
    embedding:
      api-key: ${ARK_API_KEY}
      base-url: ${ARK_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      model: embedding-3
      # token 速率上限（/秒）：GLM 限流档位未实测，先留 1000/s 安全线，可按实测调高
      tokens-per-second: ${ARK_EMBEDDING_TPS:1000}
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      rerank:
        enabled: true
        model: qwen3-rerank
        timeout-ms: 10000
        api-key: ${DASHSCOPE_API_KEY}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# AI配置
ai:
  conversation:
    max-messages: 100
    expiry-hours: 24
  agent:
    reflection:
      enabled: true
  rag:
    # 召回层融合策略：RRF（倒数排名融合，两路命中累加名次贡献，推荐）| UNION（向量通道优先、BM25 补位）
    fusion-mode: RRF
  vector:
    # Docker 部署由 compose 传入 QDRANT_URL=http://qdrant:6333，本地 IDE 默认 localhost
    qdrant-url: ${QDRANT_URL:http://localhost:6333}
  aiops:
    metrics:
      retention-ms: 900000
      persist-interval-ms: 60000
    detection:
      interval-ms: 60000
      window-ms: 300000
      latency-p95-threshold-ms: 5000
      error-rate-threshold: 0.1
      min-request-count: 10
    alert:
      cooldown-ms: 300000

# MinIO配置
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: doc-ai
  # bucket=permissionGroup1,permissionGroup2; another-bucket=groupA
  # JWT 中的 role 会作为默认权限组；可额外通过 permissionGroups/groups claim 扩展。
  bucket-permissions: "documents=admin,user;doc-ai=admin,user"
  bucket-permission-default-allow: false
  url:
    expiry: 3600
  recycle:
    expiry-days: 7
  delete:
    confirmation-timeout: 300

# 文档服务配置
document:
  service:
    url: http://document:8084

# 日志配置
logging:
  level:
    com.javaee.aiservice: debug
    org.springframework.ai: info
    org.springframework.security: info

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
